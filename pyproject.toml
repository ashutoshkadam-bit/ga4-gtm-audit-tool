[project]
name = "ga4-gtm-audit-tool"
version = "1.2.0"
description = "Read-only audit tool for Google Analytics 4, Google Tag Manager and live web pages."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network'"
markers = [
    "browser: needs a headless Chromium browser (Playwright)",
    "network: needs internet access (run with: pytest -m network)",
]

[tool.ruff]
line-length = 170
target-version = "py311"
extend-exclude = [".venv", "scripts/_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E701", "E702", "E731", "E741", "E402"]

